<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SV.Services | Plataforma de Gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #09090b;
        --bg-raised: #0f1015;
        --bg-overlay: #141419;
        --bg-float: #1a1a22;
        --bg-subtle: #1f1f28;
        --line: rgba(255, 255, 255, 0.06);
        --line-mid: rgba(255, 255, 255, 0.1);
        --line-hi: rgba(255, 255, 255, 0.16);
        --t1: #f4f4f5;
        --t2: #a1a1aa;
        --t3: #71717a;
        --t4: #52525b;
        --brand: #6366f1;
        --brand-light: #818cf8;
        --brand-dim: #6366f115;
        --green: #22c55e;
        --green-dim: #22c55e18;
        --amber: #f59e0b;
        --amber-dim: #f59e0b18;
        --red: #ef4444;
        --red-dim: #ef444418;
        --blue: #3b82f6;
        --blue-dim: #3b82f618;
        --purple: #a855f7;
        --purple-dim: #a855f718;
        --cyan: #06b6d4;
        --r8: 8px;
        --r12: 12px;
        --r16: 16px;
        --sb: 240px;
        --tb: 52px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg-base);
        color: var(--t1);
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 14px;
        overflow: hidden;
      }

      /* LOGIN */
      #loginScreen {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at 60% 40%,
          #1a1a3a 0%,
          var(--bg-base) 70%
        );
        z-index: 100;
      }
      .login-mesh {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.08) 1px,
          transparent 1px
        );
        background-size: 32px 32px;
        pointer-events: none;
      }
      .login-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
        background-size: 80px 80px;
        pointer-events: none;
      }
      .login-card {
        position: relative;
        background: rgba(15, 16, 21, 0.92);
        border: 1px solid var(--line-mid);
        border-radius: var(--r16);
        padding: 36px;
        width: 100%;
        max-width: 420px;
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(99, 102, 241, 0.1);
        backdrop-filter: blur(20px);
      }
      .login-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .brand-cube {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #6366f1, #818cf8);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        color: #fff;
        flex-shrink: 0;
      }
      .brand-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--t1);
        letter-spacing: -0.3px;
      }
      .brand-title em {
        color: var(--brand-light);
        font-style: normal;
      }
      .brand-tagline {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .login-h {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
      }
      .login-sub {
        font-size: 13px;
        color: var(--t3);
        margin-bottom: 22px;
      }
      .f-row {
        margin-bottom: 14px;
      }
      .f-label {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--t2);
        margin-bottom: 5px;
        letter-spacing: 0.02em;
      }
      .f-ctrl {
        width: 100%;
        background: var(--bg-float);
        border: 1px solid var(--line-mid);
        border-radius: var(--r8);
        padding: 9px 12px;
        color: var(--t1);
        font-size: 13.5px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
      }
      .f-ctrl:focus {
        border-color: var(--brand);
      }
      .login-btn {
        width: 100%;
        padding: 11px;
        background: linear-gradient(135deg, #6366f1, #818cf8);
        border: none;
        border-radius: var(--r8);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.1s;
        font-family: inherit;
        margin-bottom: 18px;
      }
      .login-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .login-btn:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }
      .login-footer {
        font-size: 11px;
        color: var(--t4);
        text-align: center;
      }

      /* APP LAYOUT */
      #app {
        display: none;
        height: 100vh;
        width: 100vw;
        position: fixed;
        inset: 0;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sb);
        background: var(--bg-raised);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        z-index: 50;
        transition: transform 0.2s;
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 49;
      }
      .sidebar-overlay.open {
        display: block;
      }
      .sb-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .sb-cube {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #6366f1, #818cf8);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 13px;
        color: #fff;
        flex-shrink: 0;
      }
      .sb-brand {
        font-size: 14px;
        font-weight: 800;
        color: var(--t1);
      }
      .sb-brand span {
        color: var(--brand-light);
      }
      .sb-ver {
        font-size: 10px;
        color: var(--t4);
      }
      .sb-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .sb-section {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--t4);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 12px 16px 4px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 16px;
        cursor: pointer;
        border-radius: 0;
        font-size: 13px;
        color: var(--t2);
        transition: all 0.12s;
        position: relative;
      }
      .sb-item:hover {
        background: var(--bg-overlay);
        color: var(--t1);
      }
      .sb-item.active {
        background: var(--brand-dim);
        color: var(--brand-light);
        font-weight: 600;
      }
      .sb-ico {
        font-size: 15px;
        width: 18px;
        text-align: center;
      }
      .sb-badge {
        background: var(--brand);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 99px;
        margin-left: auto;
      }
      .sb-foot {
        padding: 12px;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
      }
      .sb-user {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 8px;
      }
      .sb-uname {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--t1);
      }
      .sb-urole {
        font-size: 10.5px;
        color: var(--t3);
      }
      .sb-logout {
        width: 100%;
        padding: 7px;
        background: none;
        border: 1px solid var(--line);
        border-radius: var(--r8);
        color: var(--t3);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.12s;
      }
      .sb-logout:hover {
        border-color: var(--red);
        color: var(--red);
      }

      .topbar {
        position: fixed;
        left: var(--sb);
        top: 0;
        right: 0;
        height: var(--tb);
        background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        z-index: 40;
      }
      .tb-menu-btn {
        display: none;
        background: none;
        border: 1px solid var(--line);
        border-radius: var(--r8);
        color: var(--t2);
        width: 32px;
        height: 32px;
        cursor: pointer;
        font-size: 16px;
      }
      .tb-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--t1);
        letter-spacing: -0.2px;
      }
      .tb-sub {
        font-size: 11px;
        color: var(--t3);
      }
      .tb-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tb-notif {
        position: relative;
        cursor: pointer;
        font-size: 18px;
        padding: 4px;
        user-select: none;
      }
      .notif-pip {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 8px;
        height: 8px;
        background: var(--red);
        border-radius: 50%;
        border: 2px solid var(--bg-base);
        display: none;
      }

      .main {
        position: fixed;
        left: var(--sb);
        top: var(--tb);
        right: 0;
        bottom: 0;
        overflow-y: auto;
      }
      .page {
        padding: 22px 24px;
        min-height: 100%;
      }

      /* NOTIFICATIONS PANEL */
      .npanel {
        position: fixed;
        right: -320px;
        top: var(--tb);
        bottom: 0;
        width: 300px;
        background: var(--bg-raised);
        border-left: 1px solid var(--line);
        z-index: 60;
        transition: right 0.2s;
        overflow-y: auto;
      }
      .npanel.open {
        right: 0;
      }
      .npanel-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        font-size: 13px;
      }

      /* CARDS */
      .card {
        background: var(--bg-raised);
        border: 1px solid var(--line);
        border-radius: var(--r12);
        padding: 18px;
        margin-bottom: 14px;
      }
      .card-sm {
        padding: 12px;
      }
      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }
      .stat {
        background: var(--bg-raised);
        border: 1px solid var(--line);
        border-radius: var(--r12);
        padding: 16px;
      }
      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .stat-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--r8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .stat-val {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 2px;
      }
      .stat-lbl {
        font-size: 11.5px;
        color: var(--t3);
        margin-bottom: 10px;
      }
      .stat-bar {
        height: 3px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      .stat-bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.3s;
      }

      /* BADGES */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 10.5px;
        font-weight: 700;
        white-space: nowrap;
      }
      .b-pending {
        background: #f59e0b18;
        color: #f59e0b;
      }
      .b-active {
        background: #6366f118;
        color: #818cf8;
      }
      .b-approval {
        background: #a855f718;
        color: #c084fc;
      }
      .b-done {
        background: #22c55e18;
        color: #22c55e;
      }
      .b-rejected {
        background: #ef444418;
        color: #ef4444;
      }
      .b-info {
        background: #06b6d418;
        color: #06b6d4;
      }

      /* BUTTONS */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: var(--r8);
        border: 1px solid var(--line);
        background: none;
        color: var(--t2);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.12s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--line-hi);
        color: var(--t1);
      }
      .btn-brand {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .btn-brand:hover {
        background: var(--brand-light);
        border-color: var(--brand-light);
        color: #fff;
      }
      .btn-ghost {
        background: none;
      }
      .btn-danger {
        border-color: var(--red);
        color: var(--red);
      }
      .btn-danger:hover {
        background: var(--red-dim);
      }
      .btn-success {
        background: #22c55e;
        border-color: #22c55e;
        color: #fff;
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      .btn-xs {
        padding: 3px 7px;
        font-size: 11px;
      }

      /* TABLES */
      .tbl-wrap {
        overflow-x: auto;
        border-radius: var(--r8);
        border: 1px solid var(--line);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        color: var(--t3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 9px 12px;
        background: var(--bg-float);
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--t2);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: var(--bg-float);
      }

      /* PROGRESS */
      .prog-track {
        height: 5px;
        background: var(--line-mid);
        border-radius: 3px;
        overflow: hidden;
      }
      .prog-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.3s;
      }

      /* TASK CARD */
      .task-card {
        position: relative;
        background: var(--bg-raised);
        border: 1px solid var(--line);
        border-radius: var(--r12);
        padding: 16px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .task-card:hover {
        border-color: var(--line-hi);
        transform: translateY(-1px);
      }
      .tc-h {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .tc-title {
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.3;
        flex: 1;
      }
      .tc-desc {
        font-size: 12px;
        color: var(--t3);
        line-height: 1.5;
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tc-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--t3);
      }

      /* CHIP */
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        background: var(--bg-float);
        border: 1px solid var(--line);
        border-radius: 99px;
        font-size: 11px;
        color: var(--t2);
      }

      /* AVATAR */
      .ava {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-weight: 700;
        font-size: 11px;
        flex-shrink: 0;
      }
      .ava-sm {
        width: 28px;
        height: 28px;
        font-size: 10px;
      }
      .ava-lg {
        width: 64px;
        height: 64px;
        font-size: 24px;
      }

      /* MODAL */
      #modalRoot:not(:empty) {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      .modal {
        position: relative;
        background: var(--bg-overlay);
        border: 1px solid var(--line-mid);
        border-radius: var(--r16);
        padding: 24px;
        width: 100%;
        max-width: 560px;
        max-height: 85vh;
        overflow-y: auto;
        z-index: 1;
      }
      .modal-close {
        position: absolute;
        top: 14px;
        right: 14px;
        background: none;
        border: 1px solid var(--line);
        border-radius: var(--r8);
        color: var(--t3);
        width: 28px;
        height: 28px;
        cursor: pointer;
        font-size: 14px;
      }
      .modal-h {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 18px;
        letter-spacing: -0.3px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      /* TOAST */
      #toastRoot {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }

      /* ALERTS */
      .alert {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        border-radius: var(--r8);
        font-size: 13px;
        margin-bottom: 14px;
      }
      .alert-ok {
        background: #22c55e10;
        border: 1px solid #22c55e30;
        color: var(--t1);
      }
      .alert-warn {
        background: #f59e0b10;
        border: 1px solid #f59e0b30;
        color: var(--t1);
      }
      .alert-info {
        background: #6366f110;
        border: 1px solid #6366f130;
        color: var(--t1);
      }

      /* TIMELINE */
      .tl {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .tl-item {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        align-items: start;
        gap: 8px;
        padding: 8px 0;
        border-left: 2px solid var(--line);
        padding-left: 14px;
        margin-left: 8px;
        position: relative;
      }
      .tl-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line-hi);
        position: absolute;
        left: -6px;
        top: 12px;
        flex-shrink: 0;
      }
      .tl-dot.live {
        background: var(--brand);
      }
      .tl-dot.done {
        background: var(--green);
      }
      .tl-lbl {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--t1);
      }
      .tl-date {
        font-size: 10.5px;
        color: var(--t4);
        white-space: nowrap;
      }
      .tl-note {
        font-size: 11.5px;
        color: var(--t3);
        grid-column: 2/-1;
        margin-top: 1px;
      }

      /* PAGE */
      .pg-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .pg-h {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.4px;
        color: var(--t1);
      }
      .pg-sub {
        font-size: 12.5px;
        color: var(--t3);
        margin-top: 2px;
      }

      /* EMPTY STATE */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
        text-align: center;
      }
      .empty-ico {
        font-size: 40px;
        margin-bottom: 12px;
      }
      .empty-h {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .empty-s {
        font-size: 13px;
        color: var(--t3);

        background: var(--line);

        transition: background 0.15s;

        background: var(--brand-dim);
        border-color: var(--brand);

        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;

        font-size: 12px;
        font-weight: 700;
      }
      .kanban-col-cnt {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 99px;
      }
      .kanban-card {
        background: var(--bg-overlay);
        border: 1px solid var(--line);
        border-radius: var(--r8);
        padding: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.15s;

      .kanban-card:hover {
        border-color: var(--line-hi);
      }
      .kanban-card-title {
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 4px;
        line-height: 1.3;
      }
      .kanban-card-desc {
        font-size: 11px;
        color: var(--t3);
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;

      .kanban-card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
      }

        ini: (n) =>

      /* ═══════════════════════════════════════════════════════
           CORE LOGIC
        /* ═══════════════════════════════════════════════════════ */

      function mergeConfig(target, source) {
        if (!source || typeof source !== "object") return target;
        Object.keys(source).forEach((key) => {
          const nextValue = source[key];
          if (
            nextValue &&
            typeof nextValue === "object" &&
            !Array.isArray(nextValue) &&
            target[key] &&
            typeof target[key] === "object" &&
            !Array.isArray(target[key])
          ) {
            mergeConfig(target[key], nextValue);
            return;
          }
          target[key] = nextValue;
        });
        return target;
      }

      function loadPersistedConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.config);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          mergeConfig(API.config, parsed);
          document.documentElement.style.setProperty(
            "--brand",
            API.config.primaryColor || "#6366f1",
          );
          updateLoginBrand();
        } catch (error) {
          console.warn("Config load error:", error);
        }
      }

      function updateLoginBrand() {
        const cfg = API.config;
        const lb = document.querySelector(".login-brand");
        if (!lb) return;
        const logoHtml = cfg.logoUrl
          ? `<img src="${cfg.logoUrl}" style="width:40px;height:40px;object-fit:contain">`
          : `<div class="brand-cube" style="background:${cfg.primaryColor || "#6366f1"}">${(cfg.logoText || "SV")[0]}</div>`;
        lb.innerHTML = `
            ${logoHtml}

      function sanitizeRole(rawRole) {
        const role = String(rawRole || "")
          .trim()
          .toLowerCase();
        if (role === "admin" || role === "administrator") return "admin";
        if (role === "tech" || role === "technician") return "tech";
        if (role === "client" || role === "customer") return "client";
        return "";
      }

      function toPositiveInt(value, fallback) {
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
      }

      function getFirebaseRuntimeConfig() {
        return {
          enabled: Boolean(API.config.firebase.enabled),
          apiKey: String(API.config.firebase.apiKey || "").trim(),
          authDomain: String(API.config.firebase.authDomain || "").trim(),
          projectId: String(API.config.firebase.projectId || "").trim(),
          storageBucket: String(API.config.firebase.storageBucket || "").trim(),
          messagingSenderId: String(
            API.config.firebase.messagingSenderId || "",
          ).trim(),
          appId: String(API.config.firebase.appId || "").trim(),
          measurementId: String(API.config.firebase.measurementId || "").trim(),
          usersCollection: String(
            API.config.firebase.usersCollection || "users",
          ).trim(),
        };
      }

      function validateFirebaseRuntimeConfig(config) {
        const requiredFields = [
          "apiKey",
          "authDomain",
          "projectId",
          "storageBucket",
          "messagingSenderId",
          "appId",
        ];
        const missingFields = requiredFields.filter((field) => !config[field]);
        return {
          valid: config.enabled && missingFields.length === 0,
          missingFields,
        };
      }

      async function ensureFirestoreReady() {
        const config = getFirebaseRuntimeConfig();
        const validation = validateFirebaseRuntimeConfig(config);
        if (!validation.valid)
          throw new Error("Firebase deshabilitado o incompleto");
        if (!window.firebase?.auth || !window.firebase?.firestore)
          throw new Error("Firebase SDK no cargado");

        const signature = JSON.stringify(config);
        if (
          FIREBASE_RUNTIME.db &&
          FIREBASE_RUNTIME.auth &&
          FIREBASE_RUNTIME.signature === signature
        ) {
          return {
            auth: FIREBASE_RUNTIME.auth,
            db: FIREBASE_RUNTIME.db,
            storage: FIREBASE_RUNTIME.storage,
            config,
          };
        }

        let firebaseApp;
        if (!window.firebase.apps.length) {
          firebaseApp = window.firebase.initializeApp(config);
        } else {
          firebaseApp = window.firebase.app();
        }

        FIREBASE_RUNTIME.app = firebaseApp;
        FIREBASE_RUNTIME.auth = firebaseApp.auth();
        FIREBASE_RUNTIME.db = firebaseApp.firestore();
        if (window.firebase.storage)
          FIREBASE_RUNTIME.storage = firebaseApp.storage();
        FIREBASE_RUNTIME.signature = signature;
        return {
          auth: FIREBASE_RUNTIME.auth,
          db: FIREBASE_RUNTIME.db,
          storage: FIREBASE_RUNTIME.storage,
          config,
        };
      }

      function normalizeFirestoreUser(doc) {
        const data =
          typeof doc.data === "function" ? doc.data() : doc.data || {};
        const role = sanitizeRole(data.role);
        const name = String(
          data.name ||
            data.fullName ||
            data.displayName ||
            data.companyName ||
            "",
        ).trim();
        if (!role || !name) return null;
        return {
          id: data.id ?? doc.id,
          name,
          role,
          email: String(data.email || "").trim(),
          phone: String(data.phone || "").trim(),
          specialty: String(data.specialty || data.position || "").trim(),
          level: String(data.level || "").trim(),
          joined: String(
            data.joined ||
              data.createdAt ||
              new Date().toISOString().slice(0, 10),
          ).slice(0, 10),
          nit: String(data.nit || "").trim(),
          city: String(data.city || "").trim(),
          contact: String(data.contact || "").trim(),
          tasks_done: toPositiveInt(data.tasks_done, 0),
          uid: String(data.uid || doc.id).trim(),
          is_active: data.is_active !== false,
          baseHours: data.baseHours || 0,
        };
      }

      let syncUnsubs = [];
      async function setupRealtimeListeners() {
        const { db, config } = await ensureFirestoreReady();

        syncUnsubs.forEach((u) => u());
        syncUnsubs = [];

        const waitForInit = (query, callback) => {
          return new Promise((resolve) => {
            let first = true;
            const unsub = query.onSnapshot(
              (snap) => {
                callback(snap);
                if (first) {
                  first = false;
                  resolve();
                }
              },
              (err) => {
                console.error("Sync error:", err);
                if (first) {
                  first = false;
                  resolve();
                } // don't hang init
              },
            );
            syncUnsubs.push(unsub);
          });
        };

        const p1 = waitForInit(
          db.collection(config.usersCollection),
          (snapshot) => {
            const users = snapshot.docs
              .map(normalizeFirestoreUser)
              .filter(Boolean);
            API.users = users.length ? users : FALLBACK_USERS;
            buildSidebar();
            if (VIEW && ["techs", "clients", "config"].includes(VIEW))
              nav(VIEW);
          },
        );

        const p2 = waitForInit(db.collection("tasks"), (snapshot) => {
          API.tasks = snapshot.docs
            .map((doc) => ({ id: doc.id, ...doc.data() }))
            .sort((a, b) =>
              (b.createdAt || "").localeCompare(a.createdAt || ""),
            );
          if (
            VIEW &&
            [
              "dashboard",
              "tasks",
              "my-tasks",
              "my-services",
              "calendar",
            ].includes(VIEW)
          )
            nav(VIEW);
        });

        const p3 = waitForInit(db.collection("approvals"), (snapshot) => {
          API.approvals = snapshot.docs.map((doc) => ({
            id: doc.id,
            ...doc.data(),
          }));
          if (VIEW && ["approvals", "c-approvals", "dashboard"].includes(VIEW))
            nav(VIEW);
        });

        let p4 = Promise.resolve();
        if (CU && CU.uid) {
          p4 = waitForInit(
            db.collection("notifications").where("uid", "==", CU.uid),
            (snapshot) => {
              API.notifications = snapshot.docs.map((doc) => ({
                id: doc.id,
                ...doc.data(),
              }));
              if (VIEW === "notif") nav(VIEW);
              buildSidebar();
            },
          );
        }

        await Promise.all([p1, p2, p3, p4]);
      }

      async function applyAuthenticatedSession(authUser) {
        try {
          console.log("Applying session for:", authUser.email);
          const { db, config } = await ensureFirestoreReady();
          let profile;

          // Timeout for firestore get
          const getWithTimeout = (ref) =>
            Promise.race([
              ref.get(),
              new Promise((_, j) =>
                setTimeout(
                  () =>
                    j(new Error("Tiempo de espera agotado (Firestore Get)")),
                  8000,
                ),
              ),
            ]);

          const snap = await getWithTimeout(
            db.collection(config.usersCollection).doc(authUser.uid),
          );

          if (snap.exists) {
            profile = normalizeFirestoreUser(snap);
          } else {
            const email = authUser.email.toLowerCase();
            const pre =
              PREDEFINED_USERS.find((u) => u.email.toLowerCase() === email) ||
              (email === "wildermangt@gmail.com"
                ? { name: "Wilderman", role: "admin" }
                : null);
            if (pre) {
              profile = {
                uid: authUser.uid,
                name: pre.name,
                email,
                role: pre.role,
                is_active: true,
                joined: new Date().toISOString().slice(0, 10),
                phone: "3000000000",
                tasks_done: 0,
                baseHours: 48,
              };
              await db
                .collection(config.usersCollection)
                .doc(authUser.uid)
                .set(profile);
            } else {
              throw new Error("Usuario no autorizado en el sistema.");
            }
          }

          if (!profile || !profile.is_active)
            throw new Error("Usuario inactivo o no encontrado.");

          CU = profile;
          window.CU = profile;

          console.log("Session successful:", CU.role);
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("app").style.display = "block";

          buildSidebar();
          buildUserBox();
          updatePip();
        } catch (e) {
          console.error("Session Error:", e);
          resetSessionView(e.message || "Error desconocido en sesión", "err");
        }
      }

      function resetSessionView(msg, type = "info") {
        CU = null;
        window.CU = null;
        document.getElementById("app").style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";
        setLoginStatus(msg, type);
      }

      async function loginPro() {
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPassword").value;
        if (!email || !pass) {
          toast("Campos requeridos", "err");
          return;
        }
        try {
          setLoginStatus("Autenticando...", "info");
          const { auth } = await ensureFirestoreReady();
          await auth.signInWithEmailAndPassword(email, pass);
        } catch (e) {
          let m = e.message;
          if (
            e.code === "auth/wrong-password" ||
            e.code === "auth/invalid-credential"
          )
            m = "Credenciales inválidas.";
          setLoginStatus(m, "err");
          toast(m, "err");
        }
      }

      async function logoutPro() {
        try {
          if (FIREBASE_RUNTIME.auth) await FIREBASE_RUNTIME.auth.signOut();
        } catch (e) {}
        resetSessionView("Sesión cerrada.");
      }

      function renderCalendar() {
        const mc = document.getElementById("mainContent");
        const year = currentCalendarDate.getFullYear(),
          month = currentCalendarDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Adjust firstDay (0 is Sunday, we want 0 as Monday)
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;

        // Festivos Colombia 2026 (Fechas fijas y trasladadas)
        const colHolidays = [
          "01-01",
          "01-12",
          "03-23",
          "04-02",
          "04-03",
          "05-01",
          "05-18",
          "06-08",
          "06-15",
          "06-29",
          "07-20",
          "08-07",
          "08-17",
          "10-12",
          "11-02",
          "11-16",
          "12-08",
          "12-25",
        ];

        mc.innerHTML = `<div class="pg-head">
          <div><div class="pg-h">Calendario</div><div class="pg-sub">${currentCalendarDate.toLocaleString("es-ES", { month: "long", year: "numeric" }).toUpperCase()}</div></div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-ghost" onclick="changeMonth(-1)">&#9664; Anterior</button>
            <button class="btn btn-ghost" onclick="changeMonth(1)">Siguiente &#9654;</button>
          </div>
        </div>
          <div class="card"><div class="cal-grid">
            <div class="cal-dow">Lun</div><div class="cal-dow">Mar</div><div class="cal-dow">Mie</div><div class="cal-dow">Jue</div><div class="cal-dow">Vie</div><div class="cal-dow">Sab</div><div class="cal-dow" style="color:var(--red);">Dom</div>
            ${Array.from({ length: startOffset })
              .map(() => `<div class="cal-cell empty"></div>`)
              .join("")}
            ${Array.from({ length: daysInMonth })
              .map((_, i) => {
                const day = i + 1;
                const mStr = String(month + 1).padStart(2, "0");
                const dStr = String(day).padStart(2, "0");
                const dateStr = `${year}-${mStr}-${dStr}`;
                const dayOfWeek = new Date(year, month, day).getDay();

                const isSunday = dayOfWeek === 0;
                const isHoliday = colHolidays.includes(`${mStr}-${dStr}`);

                const isOffDay = isSunday || isHoliday;
                const cellStyle = isOffDay ? "background: #fff0f0;" : "";
                const numStyle = isOffDay ? "color: var(--red);" : "";

                const dayTasks = API.tasks.filter(
                  (t) => t.estimatedDate === dateStr,
                );
                return `<div class="cal-cell" style="${cellStyle}" onclick="if(event.target===this)openNewTask('${dateStr}')">
                <div class="cal-day-num" style="${numStyle}">${day}${isHoliday ? " 🎈" : ""}</div>
                ${dayTasks
                  .map((t) => {
                    const tech = H.byId(t.techId);
                    return `<div class="cal-dot" onclick="event.stopPropagation();openTaskDetail('${t.id}')" style="background:${H.prColor(t.priority)}22;color:${H.prColor(t.priority)};border:1px solid ${H.prColor(t.priority)}44;padding:4px;border-radius:4px;margin-bottom:4px;font-size:10px;line-height:1.2;">
                    <strong>${t.title}</strong><br/>
                    ${tech ? `👨‍🔧 ${tech.name.split(" ")[0]}` : "Sin asignar"}
                    </div>`;
                  })
                  .join("")}
              </div>`;
              })
              .join("")}
          </div></div>`;
      }

      function changeMonth(delta) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
        renderCalendar();
      }

      async function cleanOrphanTasks() {
        if (
          !confirm(
            "¿Estás seguro de eliminar todas las tareas que no tienen técnico asignado?",
          )
        )
          return;
        try {
          const { db } = await ensureFirestoreReady();
          const orphans = API.tasks.filter((t) => !H.byId(t.techId));
          if (orphans.length === 0) {
            toast("No hay tareas huérfanas", "ok");
            return;
          }
          const batch = db.batch();
          orphans.forEach((t) =>
            batch.delete(db.collection("tasks").doc(t.id)),
          );
          await batch.commit();
          toast(`${orphans.length} tareas eliminadas`, "ok");
          refreshTasksFromFirestore();
        } catch (e) {
          toast("Error al limpiar tareas", "err");
        }
      }

      async function saveConfig() {
        const c = API.config;
        const btn = event.target;
        const origText = btn.textContent;
        btn.textContent = "Guardando...";
        btn.disabled = true;

        // General
        if (document.getElementById("cfg-company")) {
          c.company = document.getElementById("cfg-company").value;
          c.primaryColor = document.getElementById("cfg-color").value;
          c.slogan = document.getElementById("cfg-slogan").value;

          const fileInput = document.getElementById("cfg-logo-file");
          if (fileInput && fileInput.files.length > 0) {
            try {
              const { storage } = await ensureFirestoreReady();
              const file = fileInput.files[0];
              const safeName = file.name
                .replace(/[^a-z0-9.]/gi, "_")
                .toLowerCase();
              const ref = storage.ref(`config/${Date.now()}_${safeName}`);
              await ref.put(file);
              c.logoUrl = await ref.getDownloadURL();
            } catch (e) {
              console.error(e);
              toast("Error al subir logo", "err");
            }
          } else {
            c.logoUrl = document.getElementById("cfg-logoUrl").value;
          }
        }
        // Social
        if (document.getElementById("cfg-fb")) {
          c.social = {
            facebook: document.getElementById("cfg-fb").value,
            instagram: document.getElementById("cfg-ig").value,
            twitter: document.getElementById("cfg-tw").value,
            linkedin: document.getElementById("cfg-li").value,

        persistConfig();
        // Apply theme color and update UI
        document.documentElement.style.setProperty("--brand", c.primaryColor);
        buildSidebar();
        toast("Configuración guardada exitosamente", "ok");

        btn.textContent = origText;
        btn.disabled = false;
        if (VIEW === "config") {
          renderConfig();
          cfgTab("general");
        }
      }

      async function uploadAttachment(tid) {
        const t = H.task(tid);
        if (!t) return;
        if (CU.role !== "admin" && t.techId !== CU.uid) {
          return toast("No tienes permiso para subir archivos", "err");
        }
        const fileInput = document.getElementById("edt-file");
        const file = fileInput.files[0];
        if (!file) {
          toast("Selecciona un archivo", "err");
          return;
        }

        try {
          const btn = fileInput.nextElementSibling;
          btn.textContent = "Subiendo...";
          btn.disabled = true;

          const { storage, db } = await ensureFirestoreReady();
          if (!storage) throw new Error("Firebase Storage no disponible");

          const ext = file.name.split(".").pop();
          const safeName = file.name.replace(/[^a-z0-9.]/gi, "_").toLowerCase();
          const path = `tasks/${tid}/${Date.now()}_${safeName}`;
          const ref = storage.ref(path);

          await ref.put(file);
          const url = await ref.getDownloadURL();

          const t = H.task(tid);
          const attachments = t.attachments || [];
          attachments.push({ name: file.name, url, path });

          await db.collection("tasks").doc(tid).update({ attachments });
          toast("Archivo subido con éxito", "ok");

          // Re-render modal silently
          openTaskDetail(tid);
        } catch (e) {
          console.error(e);
          toast("Error al subir: " + e.message, "err");
        }
      }

      async function deleteAttachment(tid, url) {
        const t = H.task(tid);
        if (!t) return;
        if (CU.role !== "admin" && t.techId !== CU.uid) {
          return toast("No tienes permiso para eliminar archivos", "err");
        }
        if (!confirm("¿Eliminar archivo?")) return;
        try {
          const { db, storage } = await ensureFirestoreReady();
          const t = H.task(tid);
          const att = (t.attachments || []).find((a) => a.url === url);
          if (!att) return;

          if (storage && att.path) {
            try {
              await storage.ref(att.path).delete();
            } catch (e) {
              console.warn("File not in storage", e);
            }
          }

          const attachments = t.attachments.filter((a) => a.url !== url);
          await db.collection("tasks").doc(tid).update({ attachments });
          toast("Archivo eliminado", "ok");
          openTaskDetail(tid);
        } catch (e) {
          toast("Error al eliminar", "err");
        }
      }

      async function updateTask(tid) {
        const t = H.task(tid);
        if (!t) return;
        if (CU.role !== "admin" && t.techId !== CU.uid) {
          return toast("No tienes permiso para modificar esta tarea", "err");
        }
        try {
          const { db } = await ensureFirestoreReady();
          const status =
            document.getElementById("edt-status")?.value || t.status;
          const progress = parseInt(
            document.getElementById("edt-progress").value,
          );

          const updates = {
            title: document.getElementById("edt-title")?.value || t.title,
            desc: document.getElementById("edt-desc")?.value || t.desc,
            techId: document.getElementById("edt-tech")?.value || t.techId,
            estimatedDate:
              document.getElementById("edt-date")?.value || t.estimatedDate,
            status: status,
            priority:
              document.getElementById("edt-priority")?.value || t.priority,
            progress: progress,
            cost: document.getElementById("edt-cost")
              ? parseInt(document.getElementById("edt-cost").value) || 0
              : t.cost || 0,
          };

          // Timestamps logic
          if (status === "inprogress" && !t.startedAt)
            updates.startedAt = new Date().toISOString();
          if (status === "done" && !t.completedAt) {
            updates.completedAt = new Date().toISOString();
            updates.progress = 100;
          }
          if (status === "pending") {
            updates.startedAt = null;
            updates.completedAt = null;
          }

          await db.collection("tasks").doc(tid).update(updates);
          toast("Cambios guardados", "ok");
          closeModal();
          await refreshTasksFromFirestore();
          nav(VIEW);
        } catch (e) {
          toast("Error al actualizar", "err");
        }
      }

      async function createTask() {

        const techId = document.getElementById("nt-tech").value;

          title,
          desc,
          clientId,
          techId,
          estimatedDate,
          priority,

          status: "pending",
          progress: 0,
          createdAt: new Date().toISOString(),
          startedAt: null,
          completedAt: null,
        };

        try {
          const { db } = await ensureFirestoreReady();
          const ref = await db.collection("tasks").add(newTask);
          newTask.id = ref.id;
          API.tasks.unshift(newTask);
          toast("Tarea creada exitosamente", "ok");
          nav(VIEW);

      async function runReseed() {
        if (
          !confirm(
            "¿Deseas restaurar la base de datos con datos de demostración? Se cerrará la sesión.",
          )
        )
          return;
        try {
          const { db, auth, config } = await ensureFirestoreReady();
          const batch = db.batch();
          const today = new Date();
          const fmtDate = (d) => d.toISOString().slice(0, 10);

          // 1. Seed Users
          const userIds = [];
          PREDEFINED_USERS.forEach((u, i) => {
            const uid =
              u.email === "admin@sv-services.com"
                ? "admin_demo_id"
                : `user_demo_${i}`;
            userIds.push(uid);
            const ref = db.collection(config.usersCollection).doc(uid);
            batch.set(ref, {
              ...u,
              uid,
              is_active: true,
              joined: fmtDate(today),
              tasks_done: 5,
              baseHours: 48,
            });
          });

          // 2. Seed Tasks (Distributed Mon-Fri)
          const tasks = [
            {
              title: "Mantenimiento Preventivo UPS",
              desc: "Revisión semestral de baterías y circuitos.",
              priority: "alta",
              cost: 150000,
            },
            {
              title: "Instalación Puesto de Trabajo",
              desc: "Cableado estructurado y configuración de equipo.",
              priority: "media",
              cost: 85000,
            },
            {
              title: "Soporte Técnico Nivel 1",
              desc: "Revisión de lentitud en aplicaciones corporativas.",
              priority: "baja",
              cost: 45000,
            },
            {
              title: "Configuración Servidor NAS",
              desc: "Backup centralizado y cuotas de usuario.",
              priority: "alta",
              cost: 320000,
            },
            {
              title: "Limpieza Física Impresoras",
              desc: "Mantenimiento preventivo lote 5 impresoras.",
              priority: "media",
              cost: 120000,
            },
            {
              title: "Auditoría de Red Wi-Fi",
              desc: "Mapa de calor y optimización de canales.",
              priority: "media",
              cost: 200000,
            },
            {
              title: "Actualización Firewall",
              desc: "Implementación de nuevas reglas de seguridad.",
              priority: "alta",
              cost: 180000,
            },
            {
              title: "Capacitación Office 365",
              desc: "Sesión de 2 horas para nuevos empleados.",
              priority: "baja",
              cost: 0,
            },
          ];

          const adminUid = userIds[0],
            techUid = userIds[1],
            clientUid = userIds[2];
          const taskIds = [];

          tasks.forEach((t, i) => {
            const tDate = new Date();
            // Distribute Mon-Fri (1 to 5)
            const dayOffset = (i % 5) + 1;
            tDate.setDate(today.getDate() + (dayOffset - today.getDay()));

            const taskData = {
              ...t,
              clientId: clientUid,
              techId: techUid,
              status: i < 5 ? "approval" : "inprogress",
              progress: i < 5 ? 90 : 30,
              createdAt: fmtDate(today),
              estimatedDate: fmtDate(tDate),
              timeline: [],
            };
            const tRef = db.collection("tasks").doc(`task_demo_${i}`);
            taskIds.push(tRef.id);
            batch.set(tRef, taskData);
          });

          // 3. Seed Approvals (5 items)
          const appTypes = [
            "Suministro de Discos Duros",
            "Cambio de Componentes",
            "Cambio de Dispositivo",
            "Suministro de Discos Duros",
            "Cambio de Componentes",
          ];
          const appNovelties = [
            "El disco duro actual presenta sectores defectuosos y riesgo inminente de pérdida de datos. Se requiere SSD de 1TB.",
            "La fuente de poder no entrega voltaje estable, causando reinicios inesperados en el equipo de gerencia.",
            "El equipo portátil del área comercial sufrió daño físico en la bisagra y pantalla. Se requiere cambio por equipo nuevo.",
            "Ampliación de capacidad de almacenamiento para el servidor principal de base de datos debido a sobrecupo.",
            "Cambio de memoria RAM de 8GB a 16GB por cuellos de botella en el software de renderizado.",
          ];
          const appStatuses = [
            "pending",
            "inprogress",
            "approved",
            "pending",
            "inprogress",
          ];

          for (let i = 0; i < 5; i++) {
            const aRef = db.collection("approvals").doc(`app_demo_${i}`);
            batch.set(aRef, {
              taskId: `task_demo_${i}`,
              requestDate: fmtDate(today),
              status: appStatuses[i],
              type: appTypes[i],
              novelty: appNovelties[i],
              cost: [250000, 150000, 1200000, 320000, 180000][i],
              createdAt: new Date().toISOString(),
            });
          }

          await batch.commit();
          await auth.signOut();
          toast(
            "Demostración cargada con éxito. Por favor inicia sesión de nuevo.",
            "ok",
          );
          setTimeout(() => location.reload(), 2500);
        } catch (e) {
          console.error(e);
          toast("Error en restauración: " + e.message, "err");
        }
      }

      /* UTILS */
      function showModal(html) {
        document.getElementById("modalRoot").innerHTML =

      }
      function closeModal() {
        document.getElementById("modalRoot").innerHTML = "";
      }
      function toast(msg, type = "ok") {
        const r = document.getElementById("toastRoot");
        const el = document.createElement("div");
        el.className = `toast toast-${type}`;
        el.textContent = msg;
        r.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 300);
        }, 3000);
      }
      function toggleNotif() {
        NOTIF_OPEN = !NOTIF_OPEN;
        document.getElementById("npanel").classList.toggle("open", NOTIF_OPEN);
      }

      /* INIT */
      async function init() {
        loadPersistedConfig();
        try {
          const { auth } = await ensureFirestoreReady();
          auth.onAuthStateChanged(async (user) => {
            console.log("Auth state changed:", user ? user.email : "No user");
            try {
              if (user) {
                await applyAuthenticatedSession(user);

                // Initialize real-time synchronization
                try {
                  console.log("Starting real-time synchronization...");
                  await setupRealtimeListeners();
                  console.log("Real-time sync active.");
                } catch (dataError) {
                  console.error("Initial sync error:", dataError);
                }

                nav("dashboard");
              } else {
                resetSessionView("Bienvenido. Ingresa para continuar.");
              }
            } catch (e) {
              console.error("Auth State Error:", e);
              resetSessionView("Error de sesión: " + e.message, "err");
            }
          });
        } catch (e) {
          console.error("Init Error:", e);
          setLoginStatus("Error de configuración Firebase.", "err");
        }
      }

      window.onload = init;
